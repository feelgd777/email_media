<style>
:root{--bg:#f7f5f0;--surface:#fffdf9;--fg:#1c1a17;--muted:#78716a;--line:#e6e1d6;--accent:#c4a265}
@media(prefers-color-scheme:dark){:root{--bg:#17150f;--surface:#211e17;--fg:#f0ece3;--muted:#a69f92;--line:#322d22;--accent:#d8b877}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"EB Garamond",Georgia,serif}
.wrap{max-width:980px;margin:0 auto;padding:44px 20px 60px}

<p class="eyebrow">Elope Music &middot; for Alaina</p><h1>Piano, Guitar &amp; Strings</h1>
<p class="lede">Clips for the August 7, 2027 wedding at Lazy Stud Ranch - one for each option, so the couple can hear the difference before they choose. Press play on any of them.</p>
<div class="grid">

<figure class="card"><div class="frame"><iframe src="https://www.youtube.com/embed/0SXabFqDkKU" title="Guitar and strings" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
<figcaption><p class="opt">Option 1 &middot; Duo, piano and guitar</p><h2>Guitar and strings</h2><p>Acoustic guitar blended with strings for a warm, layered sound - closest to the pairing the bride described.</p></figcaption></figure>

<figure class="card"><div class="frame"><iframe src="https://drive.google.com/file/d/1E35pLWGuar9OwqZq_34HEx-DyosWV_Vv/preview" title="Guitar and strings, cocktail hour" loading="lazy" allowfullscreen></iframe></div>
<figcaption><p class="opt">Option 1 &middot; through cocktail hour</p><h2>Guitar and strings, cocktail hour</h2><p>The same pairing once the ceremony ends and guests are moving around with a drink.</p></figcaption></figure>

<figure class="card"><div class="frame"><iframe src="https://www.youtube.com/embed/XHxezog3RvU" title="Strings and piano" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
<figcaption><p class="opt">Option 1 &middot; the piano side</p><h2>Strings and piano</h2><p>Piano carrying the harmony under the strings, playing Turning Page.</p></figcaption></figure>

<figure class="card"><div class="frame"><iframe src="https://drive.google.com/file/d/11mszKfDWLbHtNOSPX9eRGNNe3g3IkQbf/preview" title="Violin and cello outdoors" loading="lazy" allowfullscreen></iframe></div>
<figcaption><p class="opt">Option 2 &middot; Duo, violin and cello</p><h2>Violin and cello, outdoors</h2><p>A small string duo outdoors at a mountain resort - the same footprint with a more classic sound.</p></figcaption></figure>

<figure class="card"><div class="frame"><iframe src="https://www.youtube.com/embed/eVE7joci-9E" title="Classical strings" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
<figcaption><p class="opt">Options 3 &amp; 4 &middot; Trio and quartet</p><h2>Classical strings</h2><p>How the fuller ensembles sit in a ceremony - more voices, more body behind the melody.</p></figcaption></figure>
